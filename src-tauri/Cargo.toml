[package]
name = "authenticator-desk"
version = "0.1.0"
description = "Offline-first desktop authenticator"
authors = ["AUTHENTICATOR DESK contributors"]
edition = "2024"
license = "MIT"

[lib]
name = "authenticator_desk_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "authenticator-desk"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = []
desktop = ["dep:tauri"]

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }

[dependencies]
aes-gcm = "0.11.1"
argon2 = "0.6.0"
base32 = "0.5.1"
chrono = { version = "0.4.45", features = ["serde"] }
hmac = "0.13.0"
rand = "0.10.4"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
tauri = { version = "2.12.6", optional = true, features = [] }
thiserror = "2.0.21"
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.29.3", features = ["serde", "v4"] }
zeroize = "1.9.1"

[dev-dependencies]
serde_json = "1.0.154"
