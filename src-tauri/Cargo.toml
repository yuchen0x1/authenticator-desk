[package]
name = "authenticator-desk"
version = "0.3.0"
description = "Offline-first desktop authenticator"
authors = ["AUTHENTICATOR DESK contributors"]
edition = "2024"
license = "MIT"

[lib]
name = "authenticator_desk_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "authenticator-desk"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = []
desktop = ["dep:tauri", "dep:tauri-plugin-global-shortcut", "dep:tauri-plugin-autostart", "dep:tauri-plugin-notification", "dep:rfd"]
signed-updater = ["desktop", "dep:tauri-plugin-updater", "dep:reqwest", "dep:base64", "dep:minisign-verify", "dep:semver", "dep:windows-version"]

[profile.release]
strip = "symbols"

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }

[dependencies]
aes-gcm = { version = "0.11.1", features = ["zeroize"] }
argon2 = { version = "0.6.0", features = ["zeroize"] }
base32 = "0.5.1"
chrono = { version = "0.4.45", features = ["serde"] }
hmac = "0.13.0"
rand = "0.10.4"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
tauri = { version = "2.12.6", optional = true, features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = { version = "2.4.1", optional = true }
tauri-plugin-autostart = { version = "2.7.0", optional = true }
tauri-plugin-notification = { version = "2.8.0", optional = true }
rfd = { version = "0.17.2", optional = true }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
rqrr = "0.11.0"
thiserror = "2.0.21"
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.29.3", features = ["serde", "v4"] }
zeroize = "1.9.1"

[target.'cfg(windows)'.dependencies]
clipboard-win = "5.4.3"
tauri-plugin-updater = { version = "2.14.1", default-features = false, features = ["native-tls"], optional = true }
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "stream"], optional = true }
base64 = { version = "0.23.1", optional = true }
minisign-verify = { version = "0.3", optional = true }
semver = { version = "1", optional = true }
windows-version = { version = "0.1.7", optional = true }

[dev-dependencies]
serde_json = "1.0.154"
qrcode = { version = "0.14.1", default-features = false, features = ["image"] }
