name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "24 2 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - name: Audit production dependencies
        run: pnpm audit --prod --registry=https://registry.npmjs.org --audit-level high
      - name: Audit development dependencies
        shell: bash
        run: |
          pnpm audit --registry=https://registry.npmjs.org --json > pnpm-audit.json || node scripts/verify-pnpm-audit.mjs pnpm-audit.json
      - run: rustup update stable --no-self-update
      - run: cargo +stable install cargo-audit --locked
      - run: cargo +stable audit --file src-tauri/Cargo.lock --no-yanked --target-os windows --target-arch x86_64
