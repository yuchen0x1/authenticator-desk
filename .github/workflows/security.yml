name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "24 2 * * 2"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - name: Audit production dependencies
        run: pnpm audit --prod --registry=https://registry.npmjs.org --audit-level high
      - name: Audit development dependencies
        shell: bash
        run: |
          pnpm audit --registry=https://registry.npmjs.org --json > pnpm-audit.json
          node scripts/verify-pnpm-audit.mjs pnpm-audit.json
      - run: rustup toolchain install 1.99.1 --profile minimal --no-self-update
      - run: cargo +1.99.1 install cargo-audit --version 0.23.0 --locked
      - run: cargo +1.99.1 audit --file src-tauri/Cargo.lock --no-yanked --target-os windows --target-arch x86_64
