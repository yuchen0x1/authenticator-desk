name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag and main ancestry
        run: |
          git merge-base --is-ancestor HEAD origin/main
          node scripts/release.mjs version "$GITHUB_REF_NAME"

  verify:
    needs: tag
    uses: ./.github/workflows/ci.yml
    with:
      signed: true

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: windows-x64
          path: release-assets
      - name: Verify release bundle
        run: node scripts/release.mjs verify release-assets "$GITHUB_REF_NAME" signed
      - name: Select release notes
        id: notes
        run: node .github/scripts/select-release-notes.mjs
      - name: Upload and verify a new draft before publishing
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_PATH: ${{ steps.notes.outputs.path }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json id >/dev/null 2>&1; then
            echo "::error::A release or draft already exists for this tag. Inspect it before resuming."
            exit 1
          fi
          notes=(--generate-notes)
          if [[ -n "$NOTES_PATH" ]]; then notes=(--notes-file "$NOTES_PATH"); fi
          status=(--latest)
          if [[ "$GITHUB_REF_NAME" == *-rc.* ]]; then status=(--prerelease --latest=false); fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "$GITHUB_REF_NAME" "${notes[@]}" "${status[@]}" release-assets/*
          gh release download "$GITHUB_REF_NAME" --dir verified-download
          node scripts/release.mjs verify verified-download "$GITHUB_REF_NAME" signed
          gh release edit "$GITHUB_REF_NAME" --draft=false "${status[@]}"
          gh release view "$GITHUB_REF_NAME" --json isDraft,isPrerelease,url,assets
