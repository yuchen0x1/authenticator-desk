name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  bundle:
    name: Windows NSIS/MSI bundle
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests before packaging
        run: |
          pnpm exec tsc --noEmit
          pnpm test -- --run
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build NSIS and MSI bundles
        run: pnpm tauri build

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: authenticator-desk-${{ github.ref_name }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      # Artifacts are unsigned by design; the release notes and the
      # acceptance checklist must not claim signing or an update channel.
      - name: Attach bundles to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
