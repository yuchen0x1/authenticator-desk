name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      signed:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  authorize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Authorize signed workflow before entering release environment
        if: inputs.signed
        run: node scripts/release.mjs context

  core:
    name: Portable core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --no-self-update
      - run: cargo +1.99.1 test --locked --manifest-path src-tauri/Cargo.toml

  windows:
    needs: authorize
    name: Windows x64
    runs-on: windows-2025
    timeout-minutes: 35
    environment: ${{ inputs.signed && 'release' || 'ci' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.13.1

      - name: Install project pnpm version
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - name: Install tested Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --no-self-update

      - name: Validate release versions
        run: node scripts/release.mjs version

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check TypeScript and build frontend
        run: pnpm build

      - name: Frontend tests
        run: pnpm exec vitest run

      - name: Node release trust tests
        run: node --test scripts/*.test.mjs

      - name: Rust tests
        run: cargo +1.99.1 test --locked --manifest-path src-tauri/Cargo.toml

      - name: Check updater security boundaries
        run: cargo +1.99.1 test --locked --manifest-path src-tauri/Cargo.toml --features signed-updater --lib update::signed::tests

      - name: Check updater Rust formatting
        run: rustfmt --edition 2024 --check src-tauri/src/update.rs

      - name: Build Windows installers
        if: '!inputs.signed'
        run: pnpm tauri build --ci -- --locked

      - name: Build signed Windows installers
        if: inputs.signed
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          AUTHDESK_UPDATER_PUBLIC_KEY: ${{ vars.AUTHDESK_UPDATER_PUBLIC_KEY }}
          AUTHDESK_REQUIRE_AUTHENTICODE: ${{ vars.AUTHDESK_REQUIRE_AUTHENTICODE }}
          AUTHDESK_PUBLISHER_THUMBPRINT: ${{ vars.AUTHDESK_PUBLISHER_THUMBPRINT }}
          AUTHDESK_TIMESTAMP_URL: ${{ vars.AUTHDESK_TIMESTAMP_URL }}
        run: node scripts/release.mjs build-signed

      - name: Stage verified installers
        if: '!inputs.signed'
        run: node scripts/release.mjs stage

      - name: Sign and stage update metadata
        if: inputs.signed
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          AUTHDESK_VERIFY_PUBLIC_KEY: ${{ vars.AUTHDESK_UPDATER_PUBLIC_KEY }}
        run: node scripts/release.mjs stage signed

      - name: Verify signed metadata and installer signatures
        if: inputs.signed
        env:
          AUTHDESK_VERIFY_STAGED_RELEASE: "1"
          AUTHDESK_VERIFY_PUBLIC_KEY: ${{ vars.AUTHDESK_UPDATER_PUBLIC_KEY }}
        run: cargo +1.99.1 test --locked --manifest-path src-tauri/Cargo.toml --features signed-updater --lib update::signed::tests::verify_staged_release -- --ignored

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-x64
          path: release-assets/
          if-no-files-found: error
          retention-days: 7

  installers:
    name: Install lifecycle (${{ matrix.family }})
    needs: windows
    runs-on: windows-2025
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: NSIS
            extension: exe
          - family: MSI
            extension: msi
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: windows-x64
          path: release-assets
      # Each installer gets a fresh runner: NSIS retains its install-path hint
      # after uninstall, and MSI would otherwise reuse that previous directory.
      - name: Install, launch, reinstall and uninstall
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem release-assets/*.${{ matrix.extension }} -File)
          if ($installers.Count -ne 1) { throw 'Expected exactly one installer for this family.' }
          ./scripts/verify-install.ps1 -Installer $installers[0].FullName -Family '${{ matrix.family }}'
